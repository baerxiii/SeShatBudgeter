<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Finance Tracker v2</title>

<style>
:root{
    --primary:#0078d4;
    --success:#16a34a;
    --danger:#dc2626;
    --bg:#f5f6f8;
    --card:#ffffff;
    --text:#222;
    --border:#ddd;
}

body.dark{
    --bg:#121212;
    --card:#1e1e1e;
    --text:#f3f3f3;
    --border:#333;
}

*{
    box-sizing:border-box;
    font-family:Segoe UI,sans-serif;
}

body{
    margin:0;
    padding:20px;
    background:var(--bg);
    color:var(--text);
}

h1{
    text-align:center;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:15px;
}

.card{
    background:var(--card);
    border-radius:12px;
    padding:20px;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.summary{
    font-size:28px;
    font-weight:bold;
}

.actions{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:15px;
    margin:20px 0;
}

button{
    padding:12px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    background:var(--primary);
    color:white;
}

button:hover{
    opacity:.9;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    padding:10px;
    border-bottom:1px solid var(--border);
    text-align:left;
}

input,select{
    width:100%;
    padding:10px;
    border-radius:8px;
    border:1px solid var(--border);
    margin-top:5px;
    margin-bottom:10px;
}

.progress{
    height:20px;
    background:#ddd;
    overflow:hidden;
    border-radius:10px;
}

.bar{
    height:100%;
    background:var(--success);
}

.bar.over{
    background:var(--danger);
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.65);
    justify-content:center;
    align-items:center;
    z-index:999;
}

.modal-content{
    background:var(--card);
    color:var(--text);
    width:95%;
    max-width:600px;
    padding:20px;
    border-radius:12px;
    max-height:90vh;
    overflow:auto;
}

.close{
    float:right;
    cursor:pointer;
    font-size:24px;
}

.row-buttons{
    display:flex;
    gap:5px;
}

.row-buttons button{
    padding:6px 10px;
}

.accountRow{
    display:flex;
    gap:10px;
    margin-bottom:10px;
}

.accountRow input{
    margin:0;
}

.small{
    font-size:13px;
    opacity:.8;
}
</style>
</head>
<body>

<h1>💰 Finance Tracker v2</h1>

<div class="actions">
    <button onclick="openModal('transactionModal')">
        ➕ Add Transaction
    </button>

    <button onclick="openModal('accountsModal')">
        💳 Manage Accounts
    </button>

    <button onclick="openModal('budgetModal')">
        📊 Monthly Budgets
    </button>

    <button onclick="openModal('billsModal')">
    🧾 Recurring Bills
</button>

    <button onclick="toggleDarkMode()">
        🌙 Dark Mode
    </button>

    <button onclick="exportData()">
        📤 Export
    </button>

    <button onclick="document.getElementById('importFile').click()">
        📥 Import
    </button>

    <input hidden type="file" id="importFile" onchange="importData(event)">
</div>

<div class="grid">

    <div class="card">
        <h3>Total Budget</h3>
        <div id="budgetTotal" class="summary">$0</div>
    </div>

    <div class="card">
        <h3>Total Spent</h3>
        <div id="spentTotal" class="summary">$0</div>
    </div>

    <div class="card">
        <h3>Remaining</h3>
        <div id="remainingTotal" class="summary">$0</div>
    </div>

    <div class="card">
        <h3>Income</h3>
        <div id="incomeTotal" class="summary">$0</div>
    </div>

    <div class="card">
    <h3>Upcoming Bills</h3>
    <div id="upcomingBills">
        No Bills
    </div>
</div>

</div>

<br>

<div class="card">
<h3>Budget Progress</h3>
<div id="budgetProgress"></div>
</div>

<br>

<div class="card">
<h3>Recent Transactions</h3>

<table>
<thead>
<tr>
<th>Date</th>
<th>Description</th>
<th>Type</th>
<th>Account</th>
<th>Category</th>
<th>Amount</th>
<th>Actions</th>
</tr>
</thead>

<tbody id="transactionsTable"></tbody>
</table>
</div>

<!-- TRANSACTION MODAL -->

<div class="modal" id="transactionModal">
<div class="modal-content">

<span class="close"
onclick="closeModal('transactionModal')">&times;</span>

<h2>Add Transaction</h2>

<select id="type">
<option value="expense">Expense</option>
<option value="income">Income</option>
</select>

<input id="desc" placeholder="Description">

<input id="amount"
type="number"
step="0.01"
placeholder="Amount">

<select id="account"></select>

<div id="categoryContainer">

<label>Category</label>

<select id="category">
<option>Food</option>
<option>Gas</option>
<option>Bills</option>
<option>Entertainment</option>
<option>Shopping</option>
<option>Medical</option>
<option>Other</option>
</select>

</div>

<button onclick="addTransaction()">
Save Transaction
</button>

</div>
</div>

<!-- ACCOUNT MODAL -->

<div class="modal" id="accountsModal">
<div class="modal-content">

<span class="close"
onclick="closeModal('accountsModal')">&times;</span>

<h2>Manage Accounts</h2>

<input id="newAccount"
placeholder="Account Name">

<button onclick="addAccount()">
Add Account
</button>

<hr>

<div id="accountsList"></div>

</div>
</div>

<!-- BUDGET MODAL -->

<div class="modal" id="budgetModal">
<div class="modal-content">

<span class="close"
onclick="closeModal('budgetModal')">&times;</span>

<h2>Monthly Budgets</h2>

<div id="budgetInputs"></div>

<button onclick="saveBudgets()">
Save Budgets
</button>

</div>
</div>

<div class="modal" id="billsModal">
<div class="modal-content">

<span class="close"
onclick="closeModal('billsModal')">
&times;
</span>

<h2>Recurring Bills</h2>

<input
id="billName"
placeholder="Bill Name">

<input
id="billAmount"
type="number"
step="0.01"
placeholder="Amount">

<select id="billAccount"></select>

<input
id="billDay"
type="number"
min="1"
max="31"
placeholder="Due Day">

<label>

<input
id="billAutoCreate"
type="checkbox"
checked>

Auto Create Transaction

</label>

<button onclick="saveBill()">
Save Bill
</button>

<hr>

<div id="billList"></div>

</div>
</div>

<script>

let transactions=
JSON.parse(localStorage.getItem("transactions"))||[];

let budgets=
JSON.parse(localStorage.getItem("budgets"))||{
Visa:500,
Chequing:1500,
Savings:1000,
Cash:200
};

let editId=null;

let recurringBills=
JSON.parse(
localStorage.getItem(
"recurringBills"
)
)||[];

let editBillId=null;

if(localStorage.getItem("theme")==="dark"){
document.body.classList.add("dark");
}

function save(){

localStorage.setItem(
"transactions",
JSON.stringify(transactions)
);

localStorage.setItem(
"budgets",
JSON.stringify(budgets)
);

localStorage.setItem(
"recurringBills",
JSON.stringify(recurringBills)
);

}

function openModal(id){
renderAccounts();
renderBudgetInputs();
document.getElementById(id).style.display="flex";
}

function closeModal(id){
document.getElementById(id).style.display="none";
}

function addAccount(){

const name=
document.getElementById("newAccount")
.value.trim();

if(!name)return;

if(budgets[name]){
alert("Account exists");
return;
}

budgets[name]=0;

save();
render();
renderAccounts();

document.getElementById("newAccount").value="";
}

function deleteAccount(name){

if(!confirm(`Delete ${name}?`))
return;

delete budgets[name];

transactions=
transactions.filter(
t=>t.account!==name
);

save();
render();
}

function renderAccounts(){

const billAccount=
document.getElementById(
"billAccount"
);

if(billAccount){

billAccount.innerHTML="";

Object.keys(budgets)
.forEach(acc=>{

billAccount.innerHTML+=
`<option>${acc}</option>`;

});

}
    
const accountSelect=
document.getElementById("account");

accountSelect.innerHTML="";

Object.keys(budgets)
.forEach(acc=>{

accountSelect.innerHTML+=
`<option>${acc}</option>`;

});

let html="";

Object.keys(budgets)
.forEach(acc=>{

html+=`
<div class="accountRow">

<input
value="${acc}"
disabled>

<button
onclick="deleteAccount('${acc}')">
Delete
</button>

</div>
`;

});

document.getElementById(
"accountsList"
).innerHTML=html;
}

function renderBudgetInputs(){

let html="";

Object.keys(budgets)
.forEach(acc=>{

html+=`
<label>${acc}</label>

<input
type="number"
id="budget_${acc}"
value="${budgets[acc]}">
`;

});

document.getElementById(
"budgetInputs"
).innerHTML=html;
}

function saveBudgets(){

Object.keys(budgets)
.forEach(acc=>{

budgets[acc]=Number(
document.getElementById(
`budget_${acc}`
).value || 0
);

});

save();
render();

alert("Budgets Saved");

closeModal("budgetModal");
}

function addTransaction(){

const transaction={

id:editId || Date.now(),

date:new Date()
.toLocaleDateString(),

type:type.value,

description:desc.value,

amount:Number(amount.value),

account:account.value,

category:category.value

};

if(
!transaction.description ||
!transaction.amount
){
alert("Fill all fields");
return;
}

if(editId){

transactions=
transactions.map(t=>
t.id===editId
? transaction
: t
);

editId=null;

}else{

transactions.unshift(transaction);

}

desc.value="";
amount.value="";

save();
render();

closeModal("transactionModal");
}

function editTransaction(id){

const t=
transactions.find(
x=>x.id===id
);

editId=id;

type.value=t.type;
desc.value=t.description;
amount.value=t.amount;
account.value=t.account;
category.value=t.category;

updateTransactionForm();
openModal("transactionModal");

}

function deleteTransaction(id){

if(!confirm("Delete transaction?"))
return;

transactions=
transactions.filter(
t=>t.id!==id
);

save();
render();
}

function render(){

let totalBudget=0;
let totalSpent=0;
let totalIncome=0;

Object.values(budgets)
.forEach(v=>{

totalBudget+=v;

});

transactions.forEach(t=>{

if(t.type==="expense")
totalSpent+=t.amount;

if(t.type==="income")
totalIncome+=t.amount;

});

budgetTotal.innerText=
"$"+totalBudget.toFixed(2);

spentTotal.innerText=
"$"+totalSpent.toFixed(2);

incomeTotal.innerText=
"$"+totalIncome.toFixed(2);

remainingTotal.innerText=
"$"+
(totalBudget-totalSpent)
.toFixed(2);

transactionsTable.innerHTML=
transactions.map(t=>`

<tr>

<td>${t.date}</td>

<td>${t.description}</td>

<td>${t.type}</td>

<td>${t.account}</td>

<td>${t.category}</td>

<td>$${t.amount.toFixed(2)}</td>

<td>

<div class="row-buttons">

<button onclick="editTransaction(${t.id})">
Edit
</button>

<button onclick="deleteTransaction(${t.id})">
Delete
</button>

</div>

</td>

</tr>

`).join("");

let progressHtml="";

Object.keys(budgets)
.forEach(acc=>{

let spent=0;

transactions.forEach(t=>{

if(
t.type==="expense" &&
t.account===acc
){

spent+=t.amount;

}

});

const budget=
budgets[acc];

const percent=
budget
? Math.min(
(spent/budget)*100,
100
)
:0;

progressHtml+=`

<h4>${acc}</h4>

<div class="small">
Spent $${spent.toFixed(2)}
of $${budget.toFixed(2)}
</div>

<div class="progress">
<div
class="bar ${percent>90?'over':''}"
style="width:${percent}%">
</div>
</div>

<br>

`;
});

budgetProgress.innerHTML=
progressHtml;

renderAccounts();
}

function exportData(){

const data={
transactions,
budgets
};

const blob=
new Blob(
[
JSON.stringify(
data,
null,
2
)
],
{
type:"application/json"
}
);

const a=
document.createElement("a");

a.href=
URL.createObjectURL(blob);

a.download=
"finance-backup.json";

a.click();
}

function importData(event){

const file=
event.target.files[0];

if(!file)return;

const reader=
new FileReader();

reader.onload=e=>{

const data=
JSON.parse(
e.target.result
);

transactions=
data.transactions||[];

budgets=
data.budgets||budgets;

save();
render();

};

reader.readAsText(file);
}

function toggleDarkMode(){

document.body
.classList.toggle("dark");

localStorage.setItem(
"theme",
document.body
.classList
.contains("dark")
?"dark"
:"light"
);

}

function saveBill(){

const bill={

id:
editBillId||
Date.now(),

name:
billName.value,

amount:
Number(
billAmount.value
),

account:
billAccount.value,

day:
Number(
billDay.value
),

autoCreate:
billAutoCreate.checked

};

if(editBillId){

recurringBills=
recurringBills.map(
b=>
b.id===editBillId
?bill
:b
);

editBillId=null;

}else{

recurringBills.push(
bill
);

}

save();

renderBills();

billName.value="";
billAmount.value="";
billDay.value="";
}

function editBill(id){

const bill=
recurringBills.find(
b=>b.id===id
);

if(!bill)return;

editBillId=id;

billName.value=
bill.name;

billAmount.value=
bill.amount;

billAccount.value=
bill.account;

billDay.value=
bill.day;

billAutoCreate.checked=
bill.autoCreate;
}

function deleteBill(id){

if(
!confirm(
"Delete bill?"
)
)return;

recurringBills=
recurringBills.filter(
b=>b.id!==id
);

save();

renderBills();
}

function renderBills(){

let html="";

recurringBills.forEach(
bill=>{

html+=`

<div class="card">

<strong>
${bill.name}
</strong>

<br>

$${bill.amount.toFixed(2)}

<br>

Due Day:
${bill.day}

<br>

Account:
${bill.account}

<br><br>

<button
onclick="
editBill(
${bill.id}
)">
Edit
</button>

<button
onclick="
deleteBill(
${bill.id}
)">
Delete
</button>

</div>

<br>

`;

});

billList.innerHTML=
html;

renderUpcomingBills();
}

function renderUpcomingBills(){

if(!upcomingBills)return;

if(
!recurringBills.length
){

upcomingBills.innerHTML=
"No Bills";

return;

}

const sorted=
[...recurringBills]
.sort(
(a,b)=>
a.day-b.day
);

upcomingBills.innerHTML=
sorted
.slice(0,5)
.map(
b=>
`${b.day}: ${b.name}`
)
.join("<br>");
}

function updateTransactionForm(){

const t=
document.getElementById(
"type"
).value;

document.getElementById(
"categoryContainer"
).style.display=
t==="income"
?"none"
:"block";
}
    

render();
renderBills();

type.addEventListener(
"change",
updateTransactionForm
);

updateTransactionForm();

</script>
</body>
</html>
