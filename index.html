<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Finance Tracker</title>

<style>
:root{
--primary:#0078d4;
--success:#28a745;
--danger:#dc3545;
--bg:#f5f5f5;
--card:#ffffff;
--text:#222;
}

*{
box-sizing:border-box;
font-family:Segoe UI,sans-serif;
}

body{
margin:0;
padding:20px;
background:var(--bg);
color:var(--text);
}

.dark{
--bg:#121212;
--card:#1e1e1e;
--text:#f1f1f1;
}

h1{
text-align:center;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:15px;
}

.card{
background:var(--card);
padding:20px;
border-radius:12px;
box-shadow:0 2px 5px rgba(0,0,0,.15);
}

.summary{
font-size:24px;
font-weight:bold;
}

input,select,button{
width:100%;
padding:10px;
margin-top:8px;
border-radius:8px;
border:1px solid #ccc;
}

button{
background:var(--primary);
color:white;
border:none;
cursor:pointer;
}

button:hover{
opacity:.9;
}

table{
width:100%;
border-collapse:collapse;
margin-top:10px;
}

th,td{
padding:10px;
border-bottom:1px solid #ddd;
text-align:left;
}

.progress{
height:20px;
background:#ddd;
border-radius:10px;
overflow:hidden;
}

.bar{
height:100%;
background:var(--success);
}

.danger{
background:var(--danger);
}

.actions{
display:flex;
gap:10px;
flex-wrap:wrap;
}

.actions button{
flex:1;
}

.small{
font-size:13px;
color:#888;
}
</style>
</head>
<body>

<h1>💰 Personal Finance Tracker</h1>

<div class="actions">
<button onclick="toggleDarkMode()">🌙 Dark Mode</button>
<button onclick="exportData()">📤 Export</button>
<button onclick="document.getElementById('importFile').click()">📥 Import</button>
<input type="file" id="importFile" hidden onchange="importData(event)">
</div>

<br>

<div class="grid">
<div class="card">
<h3>Total Budget</h3>
<div class="summary" id="budgetTotal">$0</div>
</div>

<div class="card">
<h3>Total Spent</h3>
<div class="summary" id="spentTotal">$0</div>
</div>

<div class="card">
<h3>Remaining</h3>
<div class="summary" id="remainingTotal">$0</div>
</div>

<div class="card">
<h3>Income</h3>
<div class="summary" id="incomeTotal">$0</div>
</div>
</div>

<br>

<div class="grid">

<div class="card">
<h3>Add Transaction</h3>

<select id="type">
<option value="expense">Expense</option>
<option value="income">Income</option>
</select>

<input id="desc" placeholder="Description">

<input id="amount" type="number" step="0.01" placeholder="Amount">

<select id="account">
<option>Visa</option>
<option>Mastercard</option>
<option>Chequing</option>
<option>Savings</option>
<option>Cash</option>
</select>

<select id="category">
<option>Food</option>
<option>Gas</option>
<option>Bills</option>
<option>Entertainment</option>
<option>Shopping</option>
<option>Medical</option>
<option>Other</option>
</select>

<button onclick="addTransaction()">
Add Transaction
</button>
</div>

<div class="card">
<h3>Set Monthly Budgets</h3>

<label>Visa</label>
<input id="visaBudget" type="number">

<label>Mastercard</label>
<input id="mcBudget" type="number">

<label>Chequing</label>
<input id="cheqBudget" type="number">

<label>Cash</label>
<input id="cashBudget" type="number">

<button onclick="saveBudgets()">
Save Budgets
</button>
</div>

</div>

<br>

<div class="card">
<h3>Budget Progress</h3>
<div id="budgets"></div>
</div>

<br>

<div class="card">
<h3>Recent Transactions</h3>

<table>
<thead>
<tr>
<th>Date</th>
<th>Description</th>
<th>Type</th>
<th>Account</th>
<th>Category</th>
<th>Amount</th>
<th></th>
</tr>
</thead>
<tbody id="transactions"></tbody>
</table>
</div>

<script>

let transactions =
JSON.parse(localStorage.getItem("transactions")) || [];

let budgets =
JSON.parse(localStorage.getItem("budgets")) || {
    Visa: 500,
    Chequing: 1500,
    Savings: 1000,
    Cash: 200
};

if (localStorage.getItem("theme") === "dark") {
    document.body.classList.add("dark");
}

function save() {
    localStorage.setItem(
        "transactions",
        JSON.stringify(transactions)
    );

    localStorage.setItem(
        "budgets",
        JSON.stringify(budgets)
    );
}

function addTransaction() {

    const transaction = {
        id: Date.now(),
        date: new Date().toLocaleDateString(),
        type: document.getElementById("type").value,
        description: document.getElementById("desc").value,
        amount: Number(
            document.getElementById("amount").value
        ),
        account:
            document.getElementById("account").value,
        category:
            document.getElementById("category").value
    };

    if (
        !transaction.description ||
        !transaction.amount
    ) {
        alert("Fill all fields");
        return;
    }

    transactions.unshift(transaction);

    document.getElementById("desc").value = "";
    document.getElementById("amount").value = "";

    save();
    render();
}

function deleteTransaction(id) {

    transactions =
        transactions.filter(
            t => t.id !== id
        );

    save();
    render();
}

function addAccount() {

    const name =
        document.getElementById(
            "newAccount"
        ).value.trim();

    if (!name) return;

    if (budgets[name]) {
        alert("Account already exists");
        return;
    }

    budgets[name] = 0;

    document.getElementById(
        "newAccount"
    ).value = "";

    save();
    render();
}

function deleteAccount(name) {

    if (!confirm(
        `Delete ${name}?`
    )) return;

    delete budgets[name];

    transactions =
        transactions.filter(
            t => t.account !== name
        );

    save();
    render();
}

function saveBudgets() {

    Object.keys(budgets)
    .forEach(account => {

        const field =
            document.getElementById(
                "budget_" + account
            );

        if (field) {
            budgets[account] =
                Number(field.value || 0);
        }

    });

    save();
    render();
}

function renderAccounts() {

    const select =
        document.getElementById("account");

    select.innerHTML = "";

    Object.keys(budgets)
    .forEach(account => {

        select.innerHTML += `
        <option>${account}</option>
        `;

    });

    let html = "";

    Object.keys(budgets)
    .forEach(account => {

        html += `
        <div style="
            display:flex;
            gap:10px;
            margin-bottom:10px;
        ">

            <input
                id="budget_${account}"
                type="number"
                value="${budgets[account]}"
            >

            <button
                onclick="
                deleteAccount(
                    '${account}'
                )"
            >
                Delete
            </button>

        </div>
        `;

    });

    const container =
        document.getElementById(
            "accountList"
        );

    if (container) {
        container.innerHTML = html;
    }
}

function renderBudgets() {

    let html = "";

    Object.keys(budgets)
    .forEach(acc => {

        let spent = 0;

        transactions.forEach(t => {

            if (
                t.type === "expense" &&
                t.account === acc
            ) {
                spent += t.amount;
            }

        });

        let pct =
            budgets[acc]
            ? Math.min(
                (spent / budgets[acc]) * 100,
                100
            )
            : 0;

        let left =
            budgets[acc] - spent;

        html += `
        <h4>${acc}</h4>

        <div class="small">
            Spent $${spent.toFixed(2)}
            of $${budgets[acc].toFixed(2)}
            (Left $${left.toFixed(2)})
        </div>

        <div class="progress">
            <div
                class="bar ${pct > 90 ? 'danger' : ''}"
                style="width:${pct}%">
            </div>
        </div>

        <br>
        `;
    });

    document.getElementById(
        "budgets"
    ).innerHTML = html;
}

function render() {

    let totalBudget = 0;
    let totalSpent = 0;
    let totalIncome = 0;

    Object.values(budgets)
    .forEach(v => {
        totalBudget += v;
    });

    transactions.forEach(t => {

        if (t.type === "expense")
            totalSpent += t.amount;

        if (t.type === "income")
            totalIncome += t.amount;

    });

    document.getElementById(
        "budgetTotal"
    ).innerText =
        "$" + totalBudget.toFixed(2);

    document.getElementById(
        "spentTotal"
    ).innerText =
        "$" + totalSpent.toFixed(2);

    document.getElementById(
        "incomeTotal"
    ).innerText =
        "$" + totalIncome.toFixed(2);

    document.getElementById(
        "remainingTotal"
    ).innerText =
        "$" +
        (
            totalBudget -
            totalSpent
        ).toFixed(2);

    const tbody =
        document.getElementById(
            "transactions"
        );

    tbody.innerHTML = "";

    transactions.forEach(t => {

        tbody.innerHTML += `
        <tr>
            <td>${t.date}</td>
            <td>${t.description}</td>
            <td>${t.type}</td>
            <td>${t.account}</td>
            <td>${t.category}</td>
            <td>$${t.amount.toFixed(2)}</td>

            <td>
                <button
                    onclick="
                    deleteTransaction(
                        ${t.id}
                    )"
                >
                    Delete
                </button>
            </td>
        </tr>
        `;
    });

    renderBudgets();
    renderAccounts();
}

function exportData() {

    const data = {
        transactions,
        budgets
    };

    const blob = new Blob(
        [
            JSON.stringify(
                data,
                null,
                2
            )
        ],
        {
            type:
            "application/json"
        }
    );

    const a =
        document.createElement("a");

    a.href =
        URL.createObjectURL(blob);

    a.download =
        "finance-backup.json";

    a.click();
}

function importData(event) {

    const file =
        event.target.files[0];

    if (!file) return;

    const reader =
        new FileReader();

    reader.onload = function(e) {

        const data =
            JSON.parse(e.target.result);

        transactions =
            data.transactions || [];

        budgets =
            data.budgets || budgets;

        save();
        render();
    };

    reader.readAsText(file);
}

function toggleDarkMode() {

    document.body.classList.toggle(
        "dark"
    );

    localStorage.setItem(
        "theme",
        document.body.classList
        .contains("dark")
        ? "dark"
        : "light"
    );
}

render();

</script>

</body>
</html>
